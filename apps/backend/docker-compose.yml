# Backend and its Postgres. From apps/backend:
#   cp .env.example .env
#   docker compose up -d --build        # everything in Docker
#   docker compose up -d postgres       # only the database, for `bun run dev` and tests
# On the VPS (#50), with API_DOMAIN set in .env:
#   docker compose --profile vps up -d --build    # adds Caddy (HTTPS) and daily backups
name: matocard-backend

services:
  postgres:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: matocard
    # localhost only: the database is never reachable from the internet
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matocard"]
      interval: 5s
      retries: 20

  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/matocard
      PORT: "3000"
    # reach a local anvil on the host (scripts/local-chain.sh)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    profiles: [vps]
    restart: unless-stopped
    depends_on: [backend]
    # HTTPS only; 8443 on the Hostinger VPS, where another project holds 443
    ports:
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-localhost}
      HOSTINGER_API_TOKEN: ${HOSTINGER_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data

  # a compressed dump every day, the last 14 kept: the ledger is money records
  backup:
    image: postgres:18.3
    profiles: [vps]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump -h postgres -U postgres matocard | gzip > /backups/matocard-$$(date +%F).sql.gz \
            && find /backups -name 'matocard-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  pgdata:
  caddy:
