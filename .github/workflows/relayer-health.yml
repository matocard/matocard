name: Relayer health

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      min_mon:
        description: MON under which the relayer counts as low
        default: "2"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # opens an issue when the relayer runs low on MON, closes it when it is topped up
      - run: apps/backend/scripts/relayer-health.sh
        env:
          GH_TOKEN: ${{ github.token }}
          MIN_MON: ${{ inputs.min_mon || '2' }}
