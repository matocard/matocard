name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  # husky only manages local git hooks
  HUSKY: 0

jobs:
  javascript:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # pinned: new forge releases add lints, and CI must match local
          version: v1.8.3
      - name: Install dependencies
        run: |
          forge install foundry-rs/forge-std --no-git
          forge install OpenZeppelin/openzeppelin-contracts@v5.4.0 --no-git
          forge install OpenZeppelin/openzeppelin-contracts-upgradeable@v5.4.0 --no-git
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv
      - name: Coverage
        run: forge coverage --no-match-coverage 'script|test|testnet' --report summary
      - name: Committed ABIs match the contracts
        run: |
          script/export-abi.sh
          git diff --exit-code -- ../packages/contracts/src/abi
      - uses: astral-sh/setup-uv@v6
      # Any finding fails. Triaged ones are suppressed where they occur, with the
      # reason on the line above; see slither.config.json for global exclusions.
      - name: Slither
        run: uvx --from slither-analyzer==0.11.6 slither . --config-file slither.config.json --fail-pedantic
