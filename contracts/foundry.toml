[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
# the gas test reads the limits the TypeScript package publishes
fs_permissions = [{ access = "read", path = "../packages/contracts/src/gas-limits.json" }]
solc_version = "0.8.30"
# Monad runs the Fusaka EVM, so the compiler's default target is fine.
# Gas is charged on the gas limit there, not gas used: measure on Monad, not here.
optimizer = true
optimizer_runs = 200
# remappings live in remappings.txt so editors and tooling pick them up too

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"

[etherscan]
monad_testnet = { key = "${ETHERSCAN_API_KEY}", chain = 10143 }

[lint]
# mixed-case-function: `__Module_init` is OpenZeppelin's initializer convention.
# block-timestamp: holds and due dates are minutes to days long; a few seconds of
#   validator skew cannot change an outcome.
# reentrancy-events: every external entry point is nonReentrant, and the events
#   that follow a vault call carry the figures that call returned.
exclude_lints = ["mixed-case-function", "block-timestamp", "reentrancy-events"]

[fmt]
line_length = 100
tab_width = 4

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 2048

[profile.default.invariant]
# the handler only calls what the views say is allowed, so any revert is a bug
fail_on_revert = true
